# TEMPORARY — drop this file before merging the PR.
# Purpose: validate the arm64-musl build and test run on-demand, without
# waiting for the full build-and-release matrix to finish.
#
# GitHub Actions JS actions (checkout, cache, etc.) are NOT supported inside
# Alpine containers on arm64 runners. This workflow therefore runs on the plain
# ubuntu-24.04-arm host and invokes build / test steps inside an Alpine Docker
# container explicitly.
name: '[TEMP] arm64-musl smoke test'

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/arm64-musl-prebuilt'

jobs:
  config:
    uses: ./.github/workflows/reusable-config.yaml

  build-and-test:
    name: arm64 / musl / node-${{ matrix.node }}
    runs-on: ubuntu-24.04-arm
    needs: config
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 25]
    env:
      LIBCURL_RELEASE: ${{ needs.config.outputs.latest-libcurl-release }}
      LATEST_LIBCURL_RELEASE: ${{ needs.config.outputs.latest-libcurl-release }}
      ELECTRON_VERSION: ''
      PUBLISH_BINARY: false
      RUN_TESTS: false
      RUN_PREGYP_CLEAN: false
      GIT_COMMIT: ${{ github.sha }}
      GIT_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install System Packages
        uses: ./.github/actions/install-system-packages

      - name: Setup Node and PNPM
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '${{ matrix.node }}'
          skip-node-setup: 'false'

      - name: Setup Libcurl Cache (Restore)
        id: libcurl-deps-cache
        uses: ./.github/actions/setup-libcurl-cache
        with:
          libcurl-release: ${{ needs.config.outputs.latest-libcurl-release }}
          node-version: ${{ matrix.node }}
          electron-config-cache: ${{ needs.config.outputs.electron-config-cache }}
          mode: 'restore-only'

      - name: Build in Alpine container
        run: |
          PNPM_VERSION=$(node -e "const {packageManager}=require('./package.json');console.log(packageManager.split('@')[1])")
          docker run --rm \
            -e LIBCURL_RELEASE \
            -e LATEST_LIBCURL_RELEASE \
            -e ELECTRON_VERSION \
            -e PUBLISH_BINARY \
            -e GIT_COMMIT \
            -e GIT_REF_NAME \
            -e HOME=/root \
            -e PNPM_VERSION \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${HOME}/deps:/root/deps" \
            -v "${HOME}/.node-gyp:/root/.node-gyp" \
            -w "${GITHUB_WORKSPACE}" \
            "node:${{ matrix.node }}-alpine3.21" \
            sh -c '
              apk add --no-cache bash python3 make g++ cmake perl linux-headers \
                autoconf automake libtool ca-certificates coreutils pkgconfig py3-pip \
                texinfo flex bison build-base libedit-dev zlib-dev zlib-static groff git &&
              npm install -g pnpm@${PNPM_VERSION} &&
              bash ./scripts/ci/build.sh
            '

      - name: Check build succeeded
        id: built-and-installed
        run: |
          if [[ -f built-and-installed.hidden.txt ]]; then
            echo "status=true" >> $GITHUB_OUTPUT
          else
            echo "status=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Setup Libcurl Cache (Save)
        if: steps.libcurl-deps-cache.outputs.cache-hit != 'true' && steps.built-and-installed.outputs.status == 'true'
        uses: ./.github/actions/setup-libcurl-cache
        with:
          libcurl-release: ${{ needs.config.outputs.latest-libcurl-release }}
          node-version: ${{ matrix.node }}
          electron-config-cache: ${{ needs.config.outputs.electron-config-cache }}
          mode: 'save-only'

      - name: Run tests in Alpine container
        run: |
          PNPM_VERSION=$(node -e "const {packageManager}=require('./package.json');console.log(packageManager.split('@')[1])")
          docker run --rm \
            -e HOME=/root \
            -e PNPM_VERSION \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "node:${{ matrix.node }}-alpine3.21" \
            sh -c 'npm install -g pnpm@${PNPM_VERSION} && pnpm test:coverage'

      - name: Upload .node artifact
        if: steps.built-and-installed.outputs.status == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: node-libcurl-arm64-musl-node${{ matrix.node }}
          path: lib/binding/*.node
          retention-days: 3

      - name: Upload Build Logs
        if: always()
        uses: ./.github/actions/upload-build-logs
        with:
          artifact-name: build-logs-alpine-arm64-${{ needs.config.outputs.latest-libcurl-release }}-node-${{ matrix.node }}
          retention-days: '3'
