name: build-lint-test

defaults:
  run:
    shell: bash

on:
  pull_request:


concurrency:
  group: build-lint-test-${{ github.head_ref }}
  cancel-in-progress: true

# all jobs here must have a matrix identical to the ones inside build-and-release.yaml

jobs:
  config:
    uses: ./.github/workflows/reusable-config.yaml

  lint-and-tsc:
    uses: ./.github/workflows/reusable-lint-tsc.yaml

  build-and-test:
    # alpine-arm64 runs on the Ubuntu arm64 host WITHOUT a container; the build
    # and test steps use an explicit `docker run` instead because GitHub Actions
    # JS actions (checkout, cache, etc.) are not supported inside Alpine
    # containers on arm64.
    runs-on: >-
      ${{ (matrix.os == 'alpine' || matrix.os == 'rocky-linux-8')
          && 'ubuntu-22.04'
          || matrix.os == 'alpine-arm64' && 'ubuntu-24.04-arm'
          || matrix.os }}
    container: >-
      ${{ matrix.os == 'alpine'        && format('node:{0}-alpine3.22', matrix.node)
       || matrix.os == 'rocky-linux-8' && format('rockylinux:8')
       || '' }}
    needs: config
    strategy:
      fail-fast: false
      matrix:
        electron-version:
          - ''
        os:
          - macos-15
          - rocky-linux-8
          - ubuntu-24.04-arm
          - alpine
          - alpine-arm64
          - windows-2025
        libcurl-release:
          - ${{ needs.config.outputs.latest-libcurl-release }}
        node:
          - 26
          - 25
          - 24
          - 23
          - 22
        include:
          # we only want to record coverage in one of the jobs, in this case, the one for the latest stable Node.js version
          - os: rocky-linux-8
            libcurl-release: ${{ needs.config.outputs.latest-libcurl-release }}
            node: 26
            record-coverage: true
          # we also want to build a job for old libcurl versions
          - os: rocky-linux-8
            libcurl-release: ${{ needs.config.outputs.oldest-libcurl-release }}
            node: 24
    env:
      LIBCURL_RELEASE: ${{ matrix.libcurl-release }}
      LATEST_LIBCURL_RELEASE: ${{ matrix.libcurl-release }}
      ELECTRON_VERSION: ${{ matrix.electron-version }}
      # these are false because we run tests separately
      PUBLISH_BINARY: false
      RUN_TESTS: false
      RUN_PREGYP_CLEAN: false
      GIT_COMMIT: ${{ github.sha }}
      GIT_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Install updated git (Alpine)
        if: matrix.os == 'alpine'
        shell: sh
        run: |
          apk add --no-cache git bash

      - name: Install Node.js (Rocky Linux 8)
        if: matrix.os == 'rocky-linux-8'
        run: |
          dnf install -y curl git ca-certificates
          curl -fsSL https://rpm.nodesource.com/gpgkey/ns-operations-public.key \
            -o /etc/pki/rpm-gpg/ns-operations-public.key
          rpm --import /etc/pki/rpm-gpg/ns-operations-public.key
          printf '[nodesource-nodejs]\nname=Node.js Packages for Linux RPM based distros - x86_64\nbaseurl=https://rpm.nodesource.com/pub_${{ matrix.node }}.x/nodistro/nodejs/x86_64\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/ns-operations-public.key\nenabled=1\nmodule_hotfixes=1\n' \
            > /etc/yum.repos.d/nodesource-el8.repo
          dnf install -y nodejs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install System Packages
        uses: ./.github/actions/install-system-packages
    
      # see https://github.com/nodejs/node/issues/40537
      # - name: Enforce IPv4 Connectivity
      #   if: matrix.os != 'alpine'
      #   uses: ./.github/actions/force-ipv4

      # PNPM / Node.js
      - name: Setup Node and PNPM
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '${{ matrix.node }}'
          skip-node-setup: ${{ (matrix.os == 'alpine' || matrix.os == 'rocky-linux-8' || matrix.os == 'alpine-arm64') && 'true' || 'false' }}

      - name: Setup Libcurl Cache (Restore, Non-Windows)
        if: runner.os != 'Windows'
        id: libcurl-deps-cache
        uses: ./.github/actions/setup-libcurl-cache
        with:
          libcurl-release: ${{ matrix.libcurl-release }}
          node-version: ${{ matrix.node }}
          electron-version: ${{ matrix.electron-version }}
          electron-config-cache: ${{ needs.config.outputs.electron-config-cache }}
          libc-variant: ${{ matrix.os == 'alpine-arm64' && 'musl' || '' }}
          mode: 'restore-only'

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: matrix.enable-debugging

      - name: 'Build and Package Binary (Non-Windows)'
        if: runner.os != 'Windows' && matrix.os != 'alpine-arm64'
        run: ./scripts/ci/build.sh

      - name: 'Build and Package Binary (Alpine arm64)'
        # GitHub Actions JS actions don't run inside Alpine containers on arm64 runners,
        # so we build inside a docker container instead of using a container job.
        if: matrix.os == 'alpine-arm64'
        run: |
          PNPM_VERSION=$(node -e "const {packageManager}=require('./package.json');console.log(packageManager.split('@')[1])")
          docker run --rm \
            -e LIBCURL_RELEASE \
            -e LATEST_LIBCURL_RELEASE \
            -e ELECTRON_VERSION \
            -e PUBLISH_BINARY \
            -e RUN_TESTS \
            -e RUN_PREGYP_CLEAN \
            -e GIT_COMMIT \
            -e GIT_REF_NAME \
            -e HOME=/root \
            -e PNPM_VERSION="${PNPM_VERSION}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${HOME}/deps:/root/deps" \
            -v "${HOME}/.node-gyp:/root/.node-gyp" \
            -w "${GITHUB_WORKSPACE}" \
            "node:${{ matrix.node }}-alpine3.22" \
            sh -c '
              apk add --no-cache bash python3 make g++ cmake perl linux-headers \
                autoconf automake libtool ca-certificates coreutils pkgconfig py3-pip \
                texinfo flex bison build-base libedit-dev zlib-dev zlib-static groff git &&
              npm install -g pnpm@${PNPM_VERSION} &&
              bash ./scripts/ci/build.sh
            '

      - name: 'Check if fully installed and built (Non-Windows)'
        id: built-and-installed
        if: runner.os != 'Windows'
        run: |
          if [[ -f built-and-installed.hidden.txt ]]; then
            echo "built-and-installed.hidden.txt exists"
            echo "status=true" >> $GITHUB_OUTPUT
          else
            echo "built-and-installed.hidden.txt does not exist"
            echo "status=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Libcurl Cache (Save, Non-Windows)
        if: runner.os != 'Windows' && steps.libcurl-deps-cache.outputs.cache-hit != 'true' && steps.built-and-installed.outputs.status == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-libcurl-cache
        with:
          libcurl-release: ${{ matrix.libcurl-release }}
          node-version: ${{ matrix.node }}
          electron-version: ${{ matrix.electron-version }}
          electron-config-cache: ${{ needs.config.outputs.electron-config-cache }}
          libc-variant: ${{ matrix.os == 'alpine-arm64' && 'musl' || '' }}
          mode: 'save-only'

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-vcpkg-windows

      - name: 'Build and Package Binary (Windows)'
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows/build.ps1

      - name: 'Run tests'
        # no way to run vitest tests using electron's main process, so no point doing this here
        if: matrix.electron-version == '' && matrix.os != 'alpine-arm64'
        run: pnpm test:coverage

      - name: 'Run tests (Alpine arm64)'
        if: matrix.os == 'alpine-arm64' && matrix.electron-version == ''
        run: |
          PNPM_VERSION=$(node -e "const {packageManager}=require('./package.json');console.log(packageManager.split('@')[1])")
          docker run --rm \
            -e HOME=/root \
            -e PNPM_VERSION="${PNPM_VERSION}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "node:${{ matrix.node }}-alpine3.22" \
            sh -c 'npm install -g pnpm@${PNPM_VERSION} && pnpm test:coverage'

      - name: Upload coverage to Codecov
        if: matrix.record-coverage && matrix.electron-version != ''
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/**
          fail_ci_if_error: false
      
      - name: Upload Build Logs
        if: always() && runner.os != 'Windows'
        uses: ./.github/actions/upload-build-logs
        with:
          artifact-name: build-logs-${{ matrix.os }}-${{ matrix.libcurl-release }}-${{ matrix.electron-version && 'electron' || 'node' }}-${{ matrix.electron-version || matrix.node }}
          retention-days: '3'
