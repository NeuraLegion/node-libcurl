name: Install System Packages
description: Installs required system packages on macOS and Linux (incl. Alpine, Rocky Linux 8)

runs:
  using: composite
  steps:
    - name: Detect distro
      id: detect-distro
      shell: bash
      run: |
        if [ -f /etc/alpine-release ]; then
          echo "distro=alpine" >> "$GITHUB_OUTPUT"
        elif [ -f /etc/rocky-release ]; then
          echo "distro=rocky" >> "$GITHUB_OUTPUT"
        else
          echo "distro=other" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Needed packages on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils wget automake libtool cmake gnu-sed m4 groff

    - name: Install Needed packages on Linux (Debian/Ubuntu)
      if: runner.os == 'Linux' && steps.detect-distro.outputs.distro == 'other'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y cmake groff libtsan0

    - name: Install Needed packages on Linux (Rocky Linux 8)
      if: steps.detect-distro.outputs.distro == 'rocky'
      shell: bash
      run: |
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled powertools
        dnf install -y cmake groff-base make gcc gcc-c++ autoconf automake libtool perl \
          wget python3 python3-pip \
          libstdc++-static

    - name: Install Needed packages on Alpine
      if: steps.detect-distro.outputs.distro == 'alpine'
      shell: sh
      run: |
        apk --no-cache add --virtual .rundeps \
        bash ca-certificates cmake curl docker git \
        gnupg openssh-client openssl parallel pkgconfig \
        coreutils \
        python3 py3-pip make g++ \
        perl linux-headers \
        autoconf automake libtool \
        texinfo flex bison build-base libedit-dev mandoc-soelim zlib zlib-dev zlib-static
